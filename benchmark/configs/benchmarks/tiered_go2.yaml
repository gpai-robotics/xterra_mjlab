    repetitions: 1
    controller_seeds: [null]
  quick:
    levels: [L0, L1, L2, L3]
    repetitions: 10
    controller_seeds: [null]
  standard:
    levels: [L0, L1, L2, L3, L4, L5, L6, L7]
